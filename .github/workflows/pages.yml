# web/public 을 gh-pages 브랜치로 올린다 → https://ekimje.github.io/todo-note/
# 서버가 없으므로 그 주소에서는 할 일을 각자 브라우저(localStorage)에 저장한다 (app.js 의 LOCAL 모드).
# gh-pages 는 web/public 에서 자동으로 만드는 브랜치 — 직접 고치지 말 것
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: web/public → gh-pages
        run: |
          git subtree split --prefix web/public -b pages-build
          git push --force origin pages-build:gh-pages
