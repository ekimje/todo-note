# 프레젠테이션 티어 — 3단계 이미지 todo-note-web:1.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: todo-note
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: todo-note-web:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: todo-note
spec:
  selector: {app: web}
  ports:
  - port: 80
