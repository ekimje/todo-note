# 입구 — /api 는 api, 나머지(/)는 web 으로 (Traefik, http://localhost)
#   API는 root_path="/api" 라서 /api/todos 를 그대로 받아도 /todos 로 처리한다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-note
  namespace: todo-note
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port: {number: 8000}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port: {number: 80}
