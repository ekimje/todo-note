# 할 일 노트 웹 (프레젠테이션 티어) — VM에 직접 설치할 때 쓰는 nginx 사이트 설정
#   web/nginx.conf(컨테이너용)와 같고, 정적 파일 위치와 API 주소만 VM에 맞춤
#   설치: sudo cp deploy/nginx-todo-note.conf /etc/nginx/sites-available/todo-note
#         sudo ln -s /etc/nginx/sites-available/todo-note /etc/nginx/sites-enabled/ && sudo rm /etc/nginx/sites-enabled/default
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/todo-note;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 정적 화면 (프레젠테이션 티어)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # API 요청은 systemd로 띄운 uvicorn으로 전달 (/api/todos -> 127.0.0.1:8000/todos)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        client_max_body_size 16k;
    }
}
