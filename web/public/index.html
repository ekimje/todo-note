<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>할 일 노트</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할 일 노트">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151f" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Gowun+Batang:wght@700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="date" id="today"></div>
      <h1>할 일 노트</h1>
    </div>
    <div class="side">
      <div class="summary" id="summary"></div>
      <div class="sync" id="sync">연결 중…</div>
    </div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <input type="text" id="newText" placeholder="할 일을 입력하고 Enter" maxlength="200" aria-label="새 할 일" enterkeyhint="done">
    <div class="opts">
      <select id="newPri" aria-label="우선순위">
        <option value="mid">보통</option>
        <option value="high">높음</option>
        <option value="low">낮음</option>
      </select>
      <label class="date-field"><span>시작</span><input type="date" id="newStart" aria-label="시작일 (기간 일정일 때만)"></label>
      <label class="date-field"><span>마감</span><input type="date" id="newDue" aria-label="마감일"></label>
      <button class="btn-primary" type="submit" id="addBtn">추가</button>
    </div>
  </form>

  <div class="toolbar">
    <div class="filters" role="group" aria-label="보기">
      <button type="button" data-f="all" aria-pressed="true">전체</button>
      <button type="button" data-f="active" aria-pressed="false">진행 중</button>
      <button type="button" data-f="done" aria-pressed="false">완료</button>
    </div>
    <button type="button" class="link-btn" id="clearDone" hidden>완료 항목 지우기</button>
  </div>

  <div id="notice" class="notice" hidden></div>
  <ul class="list" id="list" hidden></ul>
  <div class="empty" id="empty"><strong>불러오는 중…</strong>저장된 할 일을 가져오고 있어요.</div>
  <div class="hint">할 일 글자를 누르면 수정할 수 있어요.</div>
</div>
<script src="/app.js"></script>
</body>
</html>
