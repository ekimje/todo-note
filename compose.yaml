# 할 일 노트 — 3티어 구성
#   [브라우저] → web (nginx, :8080) → api (FastAPI, :8000) → db (PostgreSQL, :5432)
# 네트워크를 둘로 나눠 web 은 db 에 직접 접근할 수 없다.

name: todo-note

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-todo}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    image: todo-note-api:1.0   # 4단계에서 kind load 할 이름
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-todo}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

  web:
    build: ./web
    image: todo-note-web:1.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true   # 외부(인터넷)와 단절된 DB 전용 네트워크

volumes:
  db-data:           # 컨테이너를 지워도 할 일 데이터는 남음
